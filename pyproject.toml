[project]
name = "mh370-monte-carlo"
version = "1.0.0"
description = "Where Is MH370? Turning Seven Circles Into a Probability Map: importance sampling and a hand-written SIR particle filter on the Inmarsat BTO data."
requires-python = ">=3.12,<3.13"
dependencies = [
    "cartopy>=0.26.0",
    "jupyterlab>=4.6.6",
    "kaleido>=1.5.2",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "numpy>=2.5.5",
    "plotly>=7.1.0",
    "scipy>=1.18.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
